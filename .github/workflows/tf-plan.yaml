name: terraform-plan
# Vocareum-mode auth: static creds from repo secrets (OIDC blocked).
# See tf-apply.yaml for context.

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/tf-plan.yaml'
  workflow_dispatch:   # let us trigger manually to verify

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev]      # Vocareum: only dev is live; restore [_shared, dev, uat, prod] for real AWS
    defaults:
      run:
        working-directory: terraform/live/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init

      - run: terraform fmt -check -recursive ../..

      - run: terraform validate

      - id: plan
        run: terraform plan -no-color -input=false 2>&1 | tee plan.out

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/live/${{ matrix.env }}/plan.out', 'utf-8');
            const summary = plan.split('\n').slice(-200).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan: \`${{ matrix.env }}\`\n\`\`\`\n${summary}\n\`\`\``
            });
