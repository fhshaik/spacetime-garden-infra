name: terraform-apply

# Vocareum-mode auth:
#   The AWS Academy Lab denies iam:CreateOpenIDConnectProvider, so we can't
#   set up GitHub OIDC against the lab account. We fall back to static
#   credentials stored as repo secrets. These expire with the 4-hour lab
#   session — refresh them by re-running `gh secret set` before each demo.
#
#   In a real AWS account, swap `aws-access-key-id` etc. back to
#   `role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}` for short-lived OIDC tokens.

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/tf-apply.yaml'
  workflow_dispatch:
    inputs:
      env:
        description: 'Env to apply'
        required: true
        type: choice
        options: [_shared, dev, uat, prod]

permissions:
  contents: read

jobs:
  apply-dev:
    if: github.event_name == 'push' || github.event.inputs.env == 'dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/live/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init
      - run: terraform apply -auto-approve -input=false

  apply-uat:
    if: github.event.inputs.env == 'uat'
    runs-on: ubuntu-latest
    environment: uat
    defaults:
      run:
        working-directory: terraform/live/uat
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init
      - run: terraform apply -auto-approve -input=false

  apply-prod:
    if: github.event.inputs.env == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: terraform/live/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init
      - run: terraform apply -auto-approve -input=false

  apply-shared:
    if: github.event.inputs.env == '_shared'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/live/_shared
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init
      - run: terraform apply -auto-approve -input=false
