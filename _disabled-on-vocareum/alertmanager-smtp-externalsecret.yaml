# Pulls the Gmail SMTP app password from AWS Secrets Manager into the
# K8s Secret that Alertmanager mounts (kube-prom-stack alertmanagerSpec.secrets).
#
# Required secret in AWS Secrets Manager (one per env):
#   garden/<env>/alertmanager/smtp
# with key 'password' (the Gmail app password, NOT the account password).
#
# Trap D.1: secret material lives only in Secrets Manager, never in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-smtp     # mounted by Alertmanager via alertmanagerSpec.secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        # The path is templated by env via the Application's targetRevision and
        # values; for shared infra at this repo level we use a sed-replace token
        # the user fills in via kustomize or replicate-per-env. Default path:
        key: "garden/dev/alertmanager/smtp"
