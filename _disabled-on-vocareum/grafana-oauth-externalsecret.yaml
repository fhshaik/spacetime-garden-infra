# Pulls the GitHub OAuth client_id + client_secret for Grafana from AWS
# Secrets Manager into a K8s Secret that Grafana reads via envValueFrom.
#
# Required secret in AWS Secrets Manager (one per env):
#   garden/<env>/grafana/oauth
# with keys 'client_id' and 'client_secret'.
#
# OAuth App must be created manually at github.com/settings/developers
# (OPEN_ITEMS §1.6). Callback URL: https://grafana.<domain>/login/github
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-github-oauth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-github-oauth   # referenced by kube-prom-stack values
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: "garden/dev/grafana/oauth"
