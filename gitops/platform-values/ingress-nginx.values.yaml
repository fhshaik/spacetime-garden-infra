controller:
  replicaCount: 2  # Trap: ingress-nginx is in the data path; needs HA + PDB
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  # Run a PodDisruptionBudget so node drain doesn't take down all replicas
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Service: type=LoadBalancer with NLB annotations (trap A.3)
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
  # Default IngressClass (trap A.6 — explicit name + default flag)
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
    controllerValue: "k8s.io/ingress-nginx"
  # Expose Prometheus metrics endpoint. ServiceMonitor disabled here — CRDs
  # are installed by kube-prom-stack which deploys later. Re-enable manually
  # via `kubectl edit svc/ingress-nginx-controller -n ingress-nginx` after
  # kube-prom-stack is up.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  config:
    use-forwarded-headers: "true"
    enable-real-ip: "true"
    server-tokens: "false"
