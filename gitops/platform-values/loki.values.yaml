# Single-binary deployment is simplest for a small cluster (no S3 split-out yet).
# For prod-scale, switch to scalable mode and use an S3 bucket as object store.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    retention_period: 168h   # 7 days
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    # Trap D.6 — labels are low-cardinality only. Enforce by limit.
    max_global_streams_per_user: 5000

singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { memory: 1Gi }
  persistence:
    enabled: true
    size: 20Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  selfMonitoring:
    enabled: false      # avoid recursive ingestion
  lokiCanary:
    enabled: false

test:
  enabled: false
