# UAT env values. Bumped by app-repo's promote-uat.yaml on every push to main.
# TODO: replace 306323843443 with your AWS account ID.

envName: uat
# Vocareum mode: cert-manager disabled — ingress is HTTP-only.
ingress:
  tls:
    enabled: false

genome-service:
  image:
    repository: 306323843443.dkr.ecr.us-east-1.amazonaws.com/genome-service
    tag: main
  replicas: 2
  database:
    enabled: true
  externalSecret:
    enabled: false   # Vocareum: ESO disabled
    awsSecretPath: garden/uat/genome-service/db
  runMigrations: true
  ingress:
    host: uat.spacetimegarden.xyz
    path: /api/genomes(/|$)(.*)
    pathRewriteEnabled: true
    pathRewriteTarget: /$2

breeding-service:
  image:
    repository: 306323843443.dkr.ecr.us-east-1.amazonaws.com/breeding-service
    tag: main
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  ingress:
    host: uat.spacetimegarden.xyz
    path: /api/breed(/|$)(.*)
    pathRewriteEnabled: true
    pathRewriteTarget: /$2

gallery-service:
  image:
    repository: 306323843443.dkr.ecr.us-east-1.amazonaws.com/gallery-service
    tag: main
  replicas: 2
  database:
    enabled: true
  externalSecret:
    enabled: false   # Vocareum: ESO disabled
    awsSecretPath: garden/uat/gallery-service/db
  ingress:
    host: uat.spacetimegarden.xyz
    path: /api/gallery(/|$)(.*)
    pathRewriteEnabled: true
    pathRewriteTarget: /$2

frontend:
  image:
    repository: 306323843443.dkr.ecr.us-east-1.amazonaws.com/frontend
    tag: main
  replicas: 2
  containerPort: 80
  # nginx serves files from /usr/share/nginx/html (root-owned). Must run as root.
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    allowPrivilegeEscalation: false
    capabilities:
      drop: []
      add: ["NET_BIND_SERVICE", "CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
  healthCheck:
    livenessPath: /
    readinessPath: /
  monitoring:
    serviceMonitor: { enabled: false }
    prometheusRule: { enabled: false }
  env:
    - name: API_BASE
      value: https://uat.spacetimegarden.xyz/api
  ingress:
    host: uat.spacetimegarden.xyz
    path: /
    pathType: Prefix
