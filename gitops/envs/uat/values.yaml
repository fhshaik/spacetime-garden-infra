# UAT env values. Bumped by app-repo's promote-uat.yaml on every push to main.
# TODO: replace 306323843443 with your AWS account ID.

envName: uat
ingress:
  tls:
    enabled: true
    issuer: letsencrypt-prod
genome-service:
  image:
    repository: 306323843443.dkr.ecr.us-east-1.amazonaws.com/genome-service
    tag: 1969ef29e7a234d5e7d6b20f29f79c2683207e9c
  replicas: 2
  database:
    enabled: true
  externalSecret:
    enabled: false # Vocareum: ESO disabled
    awsSecretPath: garden/uat/genome-service/db
  runMigrations: true
  ingress:
    host: uat.spacetimegarden.xyz
    path: /api/genomes(/.*)?$
    pathRewriteEnabled: true
    pathRewriteTarget: /genomes$1
breeding-service:
  image:
    repository: 306323843443.dkr.ecr.us-east-1.amazonaws.com/breeding-service
    tag: 1969ef29e7a234d5e7d6b20f29f79c2683207e9c
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  ingress:
    host: uat.spacetimegarden.xyz
    path: /api/breed(/.*)?$
    pathRewriteEnabled: true
    pathRewriteTarget: /breed$1
gallery-service:
  image:
    repository: 306323843443.dkr.ecr.us-east-1.amazonaws.com/gallery-service
    tag: 1969ef29e7a234d5e7d6b20f29f79c2683207e9c
  replicas: 2
  database:
    enabled: true
  externalSecret:
    enabled: false # Vocareum: ESO disabled
    awsSecretPath: garden/uat/gallery-service/db
  ingress:
    host: uat.spacetimegarden.xyz
    path: /api/gallery(/.*)?$
    pathRewriteEnabled: true
    pathRewriteTarget: /gallery$1
frontend:
  image:
    repository: 306323843443.dkr.ecr.us-east-1.amazonaws.com/frontend
    tag: 1969ef29e7a234d5e7d6b20f29f79c2683207e9c
  replicas: 2
  containerPort: 8080
  canary:
    analysis:
      enabled: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  healthCheck:
    livenessPath: /healthz
    readinessPath: /healthz
  monitoring:
    serviceMonitor: {enabled: false}
    prometheusRule: {enabled: false}
  env:
    - name: API_BASE
      value: https://uat.spacetimegarden.xyz
  ingress:
    host: uat.spacetimegarden.xyz
    path: /
    pathType: Prefix
