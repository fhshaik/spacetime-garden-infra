# Default values for the microservice chart. Per-service / per-env overrides
# come from gitops/envs/{env}/values.yaml + ApplicationSet parameters.
#
# Pitfalls preempted: trap A.6 (ingressClassName), C.1 (PDB w/ replicas>=2),
# D.3 (pullPolicy), B.2 (analysis divide-by-zero guard), B.1 (Argo CD hooks).

# Required overrides (set by ApplicationSet parameters and env values):
serviceName: ""
envName: ""

image:
  repository: ""        # set per-service via env values, e.g.
                        #   <account>.dkr.ecr.us-east-1.amazonaws.com/genome-service
  tag: "main"           # bumped to full SHA by app-repo's promote-{uat,prod}.yaml
  pullPolicy: IfNotPresent   # trap D.3 — SHA tags are immutable; no need to re-pull

replicas: 2             # trap C.1 — must be >=2 if PDB minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

containerPort: 8000

# Probes — apps already implement /healthz on port 8000 per the spec.
healthCheck:
  livenessPath: /healthz
  readinessPath: /healthz
  initialDelaySeconds: 10
  periodSeconds: 10

env: []
  # Free-form additional env vars, e.g.:
  # - name: API_BASE
  #   value: https://uat.spacetimegarden.xyz/api

# ─────────────────────────────────────────────────────────────────────────────
# Database access — only for services that talk to RDS.
# ─────────────────────────────────────────────────────────────────────────────
database:
  enabled: false
externalSecret:
  enabled: false
  refreshInterval: "1h"
  awsSecretPath: ""     # garden/<env>/<service>/db (set in env values)

# ─────────────────────────────────────────────────────────────────────────────
# Ingress (ingress-nginx + cert-manager). Per env values override host.
# ─────────────────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"    # trap A.6 — explicit, never rely on default
  host: ""              # set per-env, e.g. dev.spacetimegarden.xyz
  path: "/"             # frontend uses /; api services use /api/<service>
  pathType: "Prefix"
  pathRewriteEnabled: false   # set true for /api/<x> routes that strip prefix
  pathRewriteTarget: "/$2"
  tls:
    enabled: true
    secretName: ""      # auto-generated by cert-manager based on hostname
    issuer: "letsencrypt-prod"   # use letsencrypt-staging while iterating (trap A.1)

# ─────────────────────────────────────────────────────────────────────────────
# HPA — only enabled where horizontal scaling is meaningful (e.g. breeding).
# ─────────────────────────────────────────────────────────────────────────────
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ─────────────────────────────────────────────────────────────────────────────
# PDB — only when replicas >= 2 (trap C.1). Templated to skip otherwise.
# ─────────────────────────────────────────────────────────────────────────────
pdb:
  enabled: true
  minAvailable: 1

# ─────────────────────────────────────────────────────────────────────────────
# Argo Rollouts canary strategy — nginx integration (trap A.4)
# ─────────────────────────────────────────────────────────────────────────────
canary:
  enabled: true
  steps:
    - setWeight: 10
    - pause: { duration: 60 }
    - setWeight: 50
    - pause: { duration: 60 }
    - setWeight: 100
  analysis:
    enabled: true
    successThreshold: 0.99
    failureLimit: 1
    interval: "30s"
    startingStep: 1

# ─────────────────────────────────────────────────────────────────────────────
# ServiceMonitor + PrometheusRule for kube-prom-stack
# ─────────────────────────────────────────────────────────────────────────────
monitoring:
  serviceMonitor:
    enabled: true
    interval: "30s"
    scrapeTimeout: "10s"
    path: "/metrics"
  prometheusRule:
    enabled: true
    errorRateThreshold: 0.05    # 5% 5xx rate fires alert
    latencyThreshold: 1.0       # 1s p99 fires alert

# ─────────────────────────────────────────────────────────────────────────────
# Migration job — only genome-service sets runMigrations: true. PreSync hook
# annotations make this a sync-wave-1 step ahead of the Rollout (trap B.1).
# ─────────────────────────────────────────────────────────────────────────────
runMigrations: false
migration:
  command: ["alembic", "upgrade", "head"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  backoffLimit: 2
  ttlSecondsAfterFinished: 300

# ─────────────────────────────────────────────────────────────────────────────
# ServiceAccount — IRSA wired only if you need AWS access from the pod itself
# (most services don't; ESO handles secrets, Promtail handles logs).
# ─────────────────────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/...

# Pod-level security context (non-root by default; matches what app images expect)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false  # alembic writes temp files
